[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-linker"
version = "0.1.0"
description = "Text2SQL Schema Linking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.0.0",
    "hydra-core>=1.3.0",
    "fire>=0.5.0",
    "dvc[gdrive]>=3.0.0",
    "sql-metadata>=2.0.0",
    "pandas>=1.0.0",
    "datasets>=2.0.0",
    "pyarrow>=10.0.0",
    "gdown>=4.0.0",
    "mlflow>=2.0.0",
    "torchmetrics>=1.0.0",
    "onnx>=1.0.0",
    "onnxruntime>=1.0.0",
    "onnxscript>=0.1.0",
]
optional-dependencies = { dev = ["ruff>=0.1.0", "pre-commit>=3.0.0", "pytest>=7.0.0"] }

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", 
    "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", 
    "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", 
    "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", 
    "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"
]
ignore = ["E501", "E741"]
# Исправленный синтаксис для per-file-ignores
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"